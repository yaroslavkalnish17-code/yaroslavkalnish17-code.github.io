<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Страница не найдена</title>
  <script>
    // GitHub Pages не знает маршрутов приложения записи (/d/...).
    // Передаём путь приложению через ?p= — оно само откроет нужный экран.
    // Остальные адреса сайта не трогаем: показываем обычную «страница не найдена».
    (function () {
      var l = window.location;
      var m = l.pathname.match(/^\/d(\/.*)$/);
      if (m) l.replace(l.origin + '/d/?p=' + encodeURIComponent(m[1]) + (l.search ? '&' + l.search.slice(1) : '') + l.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui, sans-serif; background: #0b0c0f; color: #f4f5f7; }
    a { color: #a1a7b3; }
  </style>
</head>
<body>
  <main><h1>Страница не найдена</h1><p><a href="/">На главную</a></p></main>
</body>
</html>
